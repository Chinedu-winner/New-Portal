<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>News Portal</title>
</head>
<body>
    <div class="container  mx-auto mt-lg-5 shadow px-lg-4"> 
        <h2 class="my-lg-4 text-center text-decocration-underline">Education portal </h2>
        <div class="alert alert-danger" id="wordFill">Fill the gap.</div>
        <input type="name" placeholder="Name" class="form-control form-cntrol-sm shadow-none my-3" id="phone"> 
        <input type="city" placeholder="City" class="form-control form-cntrol-sm shadow-none my-3" id="computer">
        <input type="email" placeholder="Email" class="form-control form-control-sm shadow-none my-3" id="internet">
        <button onclick ='Football()' class="form-control form-control-sm p-3 bg-success my-1">Get started</button>
    </div>
    <div class="mx-auto container shadow mt-lg-5 mt-3"> 
        <table class="px-lg-5 px-2 py-3 table table-border table-striped" id="memory">
            <button onclick="Airport()">Access</button>
            <p class="text-center alter alter-black" id="sport"></p>
        </table>
    </div>
    <script>
        const Football =()=>{
        if (phone.value== ''||computer.value ==''|| internet.value==""){
        wordFill.style.block = block 
        throw  new error ("Empty, fill the gap up")
        }else {
            wordFill.style.display =  "none";
            memory.style.display = "block";
            sport.style.display = "none"; 
            let political = {
                courseId: phone.value, 
                title: computer.value, 
                inst: internet.value, 
            } 
            Football.push(political)
            document.getElementById('phone').value=""
            document.getElementById("computer").value = ""

            console.log(Football);

</body>
